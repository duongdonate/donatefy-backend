openapi: 3.0.3

info:
  title: Donatefy API
  version: 1.2.0
  description: |
    Backend của Donatefy: tìm và lấy thông tin video YouTube, lưu bài hát,
    quản lý playlist, lịch sử tìm kiếm, đăng ký/đăng nhập và avatar.

    **Kiểu phản hồi.** API đang dùng hai kiểu:
    - Một số route trả thẳng dữ liệu (object/mảng) hoặc `{ error, details }` khi lỗi.
    - Các route dùng helper `Res` trả về dạng bọc `{ status, message, data }`
      (thành công) hoặc `{ status: "error", message, error }` (lỗi).
      Các route này được đánh dấu bằng schema `*Envelope`.

    **Xác thực.** Mọi route dữ liệu yêu cầu JWT (header `Authorization: Bearer <token>`), trừ
    `GET /api/search`, `GET /api/video/{id}`, `GET /songs/{id}`, `GET /avatars/{username}` và `/api/auth/*` (login, register, refresh, logout).
    Playlist thuộc về người tạo: không phải chủ (hoặc id sai dạng) đều trả **404**, không trả 403.
    Access token có hạn 1 giờ. Đăng nhập/đăng ký còn đặt cookie httpOnly `refresh_token`
    (7 ngày, trượt, path `/api/auth`); gọi `POST /api/auth/refresh` để lấy access token mới.

security: []

servers:
  - url: /
    description: Cùng host với trang tài liệu này
  - url: http://localhost:8404
    description: Chạy ở máy (mặc định)

tags:
  - name: Auth
    description: Đăng ký, đăng nhập, thông tin người dùng
  - name: YouTube
    description: Tìm kiếm, thông tin video và gợi ý (cần YOUTUBE_API_KEY trên server)
  - name: Songs
    description: Bài hát đã lưu (CustomSong)
  - name: Playlists
    description: Playlist tự tạo (CustomPlaylist)
  - name: History
    description: Lịch sử tìm kiếm
  - name: Avatars
    description: Upload và lấy ảnh đại diện

paths:
  # ===================== Auth =====================
  /api/auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Đăng ký tài khoản
      description: |
        Tạo user mới, trả về JWT và đặt cookie `refresh_token` (httpOnly) qua `Set-Cookie`. Nếu `avatar` là `true`, server tạo sẵn một bản ghi Avatar
        rỗng; sau đó gọi `POST /upload/avatars` để tải ảnh lên.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Đăng ký thành công
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          description: Username đã tồn tại
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Username đã tồn tại
        "500":
          $ref: "#/components/responses/ServerMessage"

  /api/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Đăng nhập
      description: Trả về JWT và đặt cookie `refresh_token` (httpOnly, 7 ngày) qua `Set-Cookie`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Đăng nhập thành công, trả về JWT (hạn 1 giờ)
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "401":
          description: Sai tài khoản hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Tên tài khoản hoặc mật khẩu không chính xác
        "500":
          $ref: "#/components/responses/ServerMessage"

  /api/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Đổi refresh token lấy access token mới
      description: |
        Đọc cookie `refresh_token`, xoay sang mã mới (đặt lại cookie, hạn 7 ngày kể từ lúc này).
        Mã vừa xoay vẫn được chấp nhận thêm 30 giây (chỉ trả access token, không đổi cookie).
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "401":
          description: Thiếu cookie, cookie sai hoặc hết hạn (cookie bị xoá)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Phiên đăng nhập đã hết, vui lòng đăng nhập lại
        "500":
          $ref: "#/components/responses/ServerMessage"

  /api/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Đăng xuất
      description: Xoá phiên khỏi DB và xoá cookie `refresh_token`. Luôn trả 204, kể cả khi không có cookie.
      security:
        - refreshCookie: []
      responses:
        "204":
          description: Đã đăng xuất
        "500":
          $ref: "#/components/responses/ServerMessage"

  /api/auth/google:
    post:
      operationId: loginGoogle
      tags: [Auth]
      summary: Đăng nhập bằng Google
      description: |
        Nhận access token từ popup OAuth của Google, hỏi Google `tokeninfo` để chắc token cấp cho `GOOGLE_CLIENT_ID`, rồi lấy hồ sơ từ `userinfo`.
        Tìm user theo `googleId` (không ghép theo email/username), chưa có thì tạo mới với `username` tự sinh.
        Mỗi lần đăng nhập cập nhật `displayName` và `avatar` theo Google. Trả JWT và đặt cookie `refresh_token` như `/api/auth/login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_token]
              properties:
                access_token:
                  type: string
                  description: Access token Google (scope openid email profile)
      responses:
        "200":
          description: Đăng nhập thành công, trả về JWT (hạn 1 giờ)
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "401":
          description: Thiếu hoặc sai access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Đăng nhập Google thất bại
        "500":
          $ref: "#/components/responses/ServerMessage"

  /api/auth/me:
    get:
      operationId: getMe
      tags: [Auth]
      summary: Lấy thông tin user hiện tại
      description: Không trả về mật khẩu. `avatar` là URL ảnh nếu user đã upload hoặc là ảnh Google (URL `http…` trả nguyên), ngược lại là `null`/`false`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lấy thông tin thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Thiếu token hoặc token không hợp lệ / hết hạn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              examples:
                noToken:
                  value: { message: "No token, not authorized" }
                invalid:
                  value: { message: "Unauthorized, token invalid" }
        "404":
          description: Không tìm thấy user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: User not found
        "500":
          $ref: "#/components/responses/ServerMessage"

  # ===================== YouTube =====================
  /api/search:
    get:
      operationId: searchVideos
      tags: [YouTube]
      summary: Tìm video trên YouTube
      description: Trả tối đa 20 video. Kết quả được cache 10 phút theo từ khoá; header `X-Cache` cho biết `hit` hay `miss`.
      parameters:
        - name: q
          in: query
          required: true
          description: Từ khoá, tối thiểu 2 ký tự
          schema:
            type: string
            minLength: 2
          example: lofi chill
      responses:
        "200":
          description: Danh sách video
          headers:
            X-Cache:
              schema:
                type: string
                enum: [hit, miss]
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchItem"
                  fromCache:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/YouTubeError"

  /api/video/{id}:
    get:
      operationId: getVideo
      tags: [YouTube]
      summary: Lấy thông tin một video
      description: Cache 10 phút theo videoId.
      parameters:
        - $ref: "#/components/parameters/VideoIdPath"
      responses:
        "200":
          description: Thông tin video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoInfo"
        "404":
          description: Không tìm thấy video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/YouTubeError"

  /api/recommend:
    get:
      operationId: getRecommendations
      tags: [YouTube]
      summary: Gợi ý video cùng kênh
      description: Lấy kênh của video đầu vào rồi tìm tối đa 10 video khác của kênh đó (bỏ video đầu vào).
      parameters:
        - name: videoId
          in: query
          required: true
          description: ID video YouTube (đúng 11 ký tự)
          schema:
            type: string
            minLength: 11
            maxLength: 11
          example: dQw4w9WgXcQ
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Danh sách gợi ý
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VideoInfo"
        "400":
          description: Thiếu hoặc sai videoId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Invalid or missing videoId
        "404":
          description: Không tìm thấy video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/YouTubeError"

  # ===================== Songs =====================
  /api/songs/info:
    post:
      operationId: createSongsFromVideoIds
      tags: [Songs]
      summary: Lưu bài hát từ danh sách videoId
      description: Gọi YouTube lấy tiêu đề, kênh, ảnh, thời lượng rồi lưu thành CustomSong.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoIdsInput"
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Danh sách bài hát vừa tạo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SongInput"
              example:
                status: success
                message: Tạo bài hát từ URL thành công
                data:
                  - id: dQw4w9WgXcQ
                    name: Never Gonna Give You Up
                    artist: Rick Astley
                    thumbnail: https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg
                    createdAt: "2009-10-25T06:57:33Z"
                    duration: 213
        "400":
          $ref: "#/components/responses/EnvelopeBadRequest"
        "500":
          $ref: "#/components/responses/EnvelopeError"

  /api/songs:
    get:
      operationId: listSongs
      tags: [Songs]
      summary: Lấy danh sách bài hát
      description: |
        Không truyền `playlistId` thì trả tất cả bài hát. Có `playlistId` thì trả các bài trong playlist
        theo đúng thứ tự thêm (thứ tự `videos`), tên/kênh/bìa riêng của playlist (`meta`) đè lên bản gốc,
        bài có ghi đè mang `custom: true`.
      parameters:
        - name: playlistId
          in: query
          required: false
          schema:
            type: string
          example: 65f123abc123def456789012
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Danh sách bài hát
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PlaylistSong"
        "404":
          description: Không tìm thấy playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeError"
        "500":
          $ref: "#/components/responses/EnvelopeError"

  /songs/{id}:
    get:
      operationId: getSong
      tags: [Songs]
      summary: Lấy một bài hát theo videoId
      parameters:
        - $ref: "#/components/parameters/VideoIdPath"
      responses:
        "200":
          description: Bài hát
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
        "404":
          description: Không tìm thấy bài hát
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  # ===================== Playlists =====================
  /api/playlists:
    get:
      operationId: listPlaylists
      tags: [Playlists]
      summary: Lấy playlist của người đang đăng nhập
      description: Mới nhất trước. Mỗi playlist có thêm `shareUrl` (trang playlist trên frontend) và `cover` (= `thumbnail`, ảnh bìa gán lúc tạo, cố định).
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Danh sách playlist
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/Playlist"
                            - type: object
                              properties:
                                shareUrl:
                                  type: string
                                  format: uri
                                  example: https://donatefy.vercel.app/playlists/65f123abc123def456789012
                                cover:
                                  type: string
                                  format: uri
                                  example: http://localhost:8404/img/tanjiro.jpg
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      operationId: createPlaylist
      tags: [Playlists]
      summary: Tạo playlist
      description: Ảnh `thumbnail` được chọn ngẫu nhiên từ thư mục `public/img`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Chill buổi tối
                videos:
                  type: array
                  description: Danh sách videoId ban đầu (không bắt buộc)
                  items:
                    type: string
                  example: [dQw4w9WgXcQ]
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "201":
          description: Playlist vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/playlists/import:
    post:
      operationId: importYoutubePlaylist
      tags: [Playlists]
      summary: Nhập một playlist YouTube công khai thành playlist mới
      description: |
        Đọc danh sách video của playlist YouTube (tối đa 500 bài, giữ thứ tự gốc), lưu bài chưa có
        vào CustomSong (bài đã có không bị ghi đè) rồi tạo playlist mới của người đang đăng nhập,
        có trường `source` ghi nguồn. Video YouTube không trả về (đã xoá, riêng tư) bị bỏ qua và
        tính vào `skipped`.

        Hỗ trợ playlist Công khai và Không công khai (`list=PL...`). Không hỗ trợ: Mix tự động
        (`list=RD...`), Đã thích (`LL`), Xem sau (`WL`), playlist Riêng tư (YouTube trả 404).

        Tốn khoảng `2 × ceil(số bài / 50) + 1` đơn vị quota YouTube (200 bài ≈ 9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: Link YouTube có tham số `list=` (youtube.com, m.youtube.com, music.youtube.com)
                  example: https://www.youtube.com/playlist?list=PLx0sYbCqOb8TBPRdmBHs5Iftvv9TPboYG
                name:
                  type: string
                  description: Tên playlist; bỏ trống thì dùng tên playlist gốc. Cắt còn 60 ký tự
                  example: Nhạc chill nhập từ YouTube
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Playlist vừa tạo và thống kê
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlist:
                    $ref: "#/components/schemas/PlaylistWithCover"
                  added:
                    type: integer
                    description: Số bài đưa vào playlist
                    example: 58
                  skipped:
                    type: integer
                    description: Số video YouTube không trả về (đã xoá, riêng tư)
                    example: 2
                  truncated:
                    type: boolean
                    description: "`true` khi playlist gốc dài hơn 500 bài và đã bị cắt"
                    example: false
        "400":
          description: Link sai, không phải YouTube, thiếu `list=`, hoặc là Mix / Đã thích / Xem sau
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  videoId:
                    type: string
                    description: Chỉ có với link Mix kèm `v=`; bài đang phát, để gợi ý thêm riêng bài này
              example:
                error: "Đây là Mix tự động của YouTube, không nhập được. Mẹo: thêm các bài của Mix vào một playlist mới (Công khai hoặc Không công khai) rồi dán link playlist đó"
                videoId: qBsiWmEdj0c
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Người dùng đã nhập playlist nguồn này rồi
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  playlistId:
                    type: string
                    description: Id playlist đã nhập trước đó
              example:
                error: Bạn đã nhập playlist này rồi
                playlistId: 65f123abc123def456789012
        "422":
          description: Playlist riêng tư hoặc không tồn tại, hoặc không còn bài nào dùng được
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Playlist không công khai hoặc không tồn tại
        "503":
          description: Hết hạn mức (quota) YouTube trong ngày
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Đã hết hạn mức YouTube hôm nay, hãy thử lại sau
        "500":
          $ref: "#/components/responses/ServerError"

  /api/playlists/{id}/sync:
    post:
      operationId: syncImportedPlaylist
      tags: [Playlists]
      summary: Thêm bài mới từ playlist YouTube nguồn
      description: |
        Chỉ dùng cho playlist có `source` (đã nhập qua `/api/playlists/import`). Đọc lại playlist
        YouTube nguồn (tối đa 500 bài đầu) và thêm vào cuối những bài chưa có. Không xoá bài, không
        đổi thứ tự bài cũ, không đụng tên/bìa đã sửa (`meta`). Bài người dùng đã xoá khỏi playlist
        (`source.removedIds`) không bị thêm lại. Cập nhật `source.lastSyncedAt`.
      parameters:
        - $ref: "#/components/parameters/PlaylistIdPath"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Playlist sau khi sync và số bài mới được thêm
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlist:
                    $ref: "#/components/schemas/PlaylistWithCover"
                  added:
                    type: integer
                    example: 3
        "400":
          description: Playlist không được nhập từ YouTube (không có `source`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Playlist này không được nhập từ YouTube
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/PlaylistNotFound"
        "422":
          description: Playlist nguồn đã chuyển sang riêng tư hoặc bị xoá
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Playlist không công khai hoặc không tồn tại
        "503":
          description: Hết hạn mức (quota) YouTube trong ngày
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/playlists/{id}:
    get:
      operationId: getPlaylist
      tags: [Playlists]
      summary: Lấy một playlist
      description: Kèm `cover` (= `thumbnail`, ảnh bìa gán lúc tạo, cố định).
      parameters:
        - $ref: "#/components/parameters/PlaylistIdPath"
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistWithCover"
        "404":
          $ref: "#/components/responses/PlaylistNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      operationId: updatePlaylist
      tags: [Playlists]
      summary: Đổi tên playlist và/hoặc sửa tên, kênh, bìa riêng của một bài
      description: |
        Cần ít nhất một trong `name`, `song`. `song` ghi đè TOÀN BỘ meta của bài đó trong playlist này
        (trường bỏ trống / không gửi thì về bản gốc của CustomSong; gửi chỉ `{ id }` là xoá hết ghi đè).
        Bài gốc (CustomSong) không bị đổi. Không có API đổi thứ tự bài.
      parameters:
        - $ref: "#/components/parameters/PlaylistIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 60
                  description: Tính sau khi trim
                  example: Chill buổi tối
                song:
                  allOf:
                    - type: object
                      required: [id]
                      properties:
                        id:
                          type: string
                          description: videoId đang có trong playlist
                          example: jfKfPfyJRdk
                    - $ref: "#/components/schemas/SongMetaInput"
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Playlist sau khi sửa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistWithCover"
        "400":
          description: "Thiếu cả name và song; name rỗng hoặc > 60 ký tự; thiếu song.id; tên/kênh > 200 ký tự; thumbnail không hợp lệ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Tên playlist dài 1–60 ký tự
        "404":
          description: Không tìm thấy playlist, hoặc `song.id` không có trong playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: deletePlaylist
      tags: [Playlists]
      summary: Xoá playlist
      parameters:
        - $ref: "#/components/parameters/PlaylistIdPath"
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Đã xoá
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Đã xóa playlist thành công
        "404":
          $ref: "#/components/responses/PlaylistNotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/playlists/{id}/add-song:
    post:
      operationId: addSongsToPlaylist
      tags: [Playlists]
      summary: Thêm bài hát vào playlist
      description: |
        Bài chưa có trong CustomSong thì lấy từ YouTube và tạo mới (bài đã có không bị ghi đè).
        Thêm vào cuối playlist các videoId chưa có trong playlist (id đã có thì bỏ qua; video
        YouTube không trả về như link hỏng, đã xoá thì không thêm). `name`/`artist`/`thumbnail`
        chỉ dùng khi `videoIds` có đúng 1 phần tử, lưu riêng cho playlist này (`meta`).
        Lưu ý đường dẫn dùng `playlist` (số ít).
      parameters:
        - $ref: "#/components/parameters/PlaylistIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/VideoIdsInput"
                - $ref: "#/components/schemas/SongMetaInput"
            example:
              videoIds: [jfKfPfyJRdk]
              name: Lofi học bài
              thumbnail: https://i.ytimg.com/vi/jfKfPfyJRdk/hq2.jpg
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Playlist sau khi thêm và số bài thực sự được thêm
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlist:
                    $ref: "#/components/schemas/PlaylistWithCover"
                  added:
                    type: integer
                    example: 1
        "400":
          description: "videoIds thiếu, rỗng hoặc có id không đúng dạng 11 ký tự; tên/kênh > 200 ký tự; thumbnail không hợp lệ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Ảnh bìa không hợp lệ
        "404":
          $ref: "#/components/responses/PlaylistNotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/playlists/{id}/remove-song:
    post:
      operationId: removeSongFromPlaylist
      tags: [Playlists]
      summary: Gỡ một bài hát khỏi playlist
      description: Xoá luôn tên/kênh/bìa riêng (`meta`) của bài đó trong playlist.
      parameters:
        - $ref: "#/components/parameters/PlaylistIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [videoId]
              properties:
                videoId:
                  type: string
                  example: dQw4w9WgXcQ
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Playlist sau khi gỡ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/PlaylistNotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  # ===================== History =====================
  /api/history:
    get:
      operationId: listSearchHistory
      tags: [History]
      summary: Lấy lịch sử tìm kiếm
      description: Mới nhất trước, tối đa 50 mục. Lịch sử hiện dùng chung cho mọi người dùng.
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Danh sách lịch sử
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchHistory"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      operationId: saveSearchHistory
      tags: [History]
      summary: Lưu một từ khoá
      description: Từ khoá được chuyển sang chữ thường; nếu đã có thì xoá bản cũ rồi lưu lại để đưa lên đầu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  example: lofi chill
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Đã lưu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Đã lưu lịch sử tìm kiếm
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: clearSearchHistory
      tags: [History]
      summary: Xoá toàn bộ lịch sử
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Đã xoá
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Đã xóa toàn bộ lịch sử tìm kiếm
        "500":
          $ref: "#/components/responses/ServerError"

  /api/history/{query}:
    delete:
      operationId: deleteSearchHistoryItem
      tags: [History]
      summary: Xoá một từ khoá
      description: So khớp chính xác (lịch sử lưu chữ thường). Trả 200 kể cả khi không có gì để xoá.
      parameters:
        - name: query
          in: path
          required: true
          schema:
            type: string
          example: lofi chill
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Đã xoá
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Đã xóa lịch sử cho lofi chill
        "500":
          $ref: "#/components/responses/ServerError"

  # ===================== Avatars =====================
  /upload/avatars:
    post:
      operationId: uploadAvatar
      tags: [Avatars]
      summary: Upload ảnh đại diện
      description: |
        Chỉ nhận jpeg/jpg/png/gif. File được lưu thành `<username>.<đuôi>` với username của
        người trong token (không đọc form) và gắn vào bản ghi Avatar đã tạo lúc đăng ký.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
            encoding:
              avatar:
                contentType: image/png, image/jpeg, image/gif
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "201":
          description: Upload thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Upload success
        "400":
          description: Không có file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: No file uploaded
        "500":
          description: File không phải ảnh hoặc lỗi server
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /avatars/{username}:
    get:
      operationId: getAvatar
      tags: [Avatars]
      summary: Lấy file ảnh đại diện
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          example: duongdev
      responses:
        "200":
          description: File ảnh
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Chưa có avatar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Avatar not found
        "500":
          $ref: "#/components/responses/ServerMessage"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token

  parameters:
    VideoIdPath:
      name: id
      in: path
      required: true
      description: ID video YouTube
      schema:
        type: string
      example: dQw4w9WgXcQ
    PlaylistIdPath:
      name: id
      in: path
      required: true
      description: "`_id` của playlist (MongoDB ObjectId)"
      schema:
        type: string
      example: 65f123abc123def456789012

  responses:
    Unauthorized:
      description: Thiếu token hoặc token không hợp lệ / hết hạn
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
          examples:
            noToken:
              value: { message: "No token, not authorized" }
            invalid:
              value: { message: "Unauthorized, token invalid" }
    BadRequest:
      description: Thiếu hoặc sai tham số
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Lỗi server
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerMessage:
      description: Lỗi server
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
          example:
            message: Lỗi server
    YouTubeError:
      description: Thiếu YOUTUBE_API_KEY trên server, hoặc YouTube API báo lỗi (mã lỗi có thể là mã YouTube trả về)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            noKey:
              value: { error: "YOUTUBE_API_KEY không được cấu hình" }
            upstream:
              value:
                {
                  error: "Lỗi server",
                  details: "Request failed with status code 403",
                }
    PlaylistNotFound:
      description: Không tìm thấy playlist, hoặc playlist không phải của người đang đăng nhập
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Không tìm thấy playlist
    EnvelopeBadRequest:
      description: Dữ liệu không hợp lệ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
          example:
            status: error
            message: videoIds phải là một mảng các ID video
            error: null
    EnvelopeError:
      description: Lỗi server
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"

  schemas:
    Message:
      type: object
      properties:
        message:
          type: string

    Error:
      type: object
      properties:
        error:
          type: string
          example: Lỗi server
        details:
          description: Chi tiết lỗi (chuỗi hoặc object trả về từ YouTube)
          oneOf:
            - type: string
            - type: object

    Envelope:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
        data: {}

    EnvelopeError:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
        error:
          nullable: true
          type: string

    RegisterInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: duongdev
        password:
          type: string
          format: password
          example: "123456"
        avatar:
          type: boolean
          description: "`true` nếu sẽ upload ảnh đại diện sau khi đăng ký"
          example: true

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: duongdev
        password:
          type: string
          format: password
          example: "123456"

    User:
      type: object
      properties:
        _id:
          type: string
          example: 65f123abc123def456789012
        username:
          type: string
          example: duongdev
        displayName:
          type: string
          description: Tên Google, chỉ có ở user đăng nhập bằng Google
          example: Dương Hải
        avatar:
          type: string
          nullable: true
          description: URL ảnh nếu đã upload. Nếu chưa có, giá trị là `null` (hoặc `false` với tài khoản đăng ký không chọn avatar).
          example: http://localhost:8404/uploads/avatars/duongdev.png

    SearchItem:
      type: object
      properties:
        id:
          type: string
          example: dQw4w9WgXcQ
        title:
          type: string
          example: Never Gonna Give You Up
        artist:
          type: string
          description: Tên kênh YouTube
          example: Rick Astley
        thumbnail:
          type: string
          format: uri

    VideoInfo:
      type: object
      properties:
        id:
          type: string
          example: dQw4w9WgXcQ
        title:
          type: string
          example: Never Gonna Give You Up
        channel:
          type: string
          example: Rick Astley
        thumbnail:
          type: string
          format: uri

    VideoIdsInput:
      type: object
      required: [videoIds]
      properties:
        videoIds:
          type: array
          items:
            type: string
          example: [dQw4w9WgXcQ, 9bZkp7q19f0]

    SongInput:
      type: object
      properties:
        id:
          type: string
          description: videoId YouTube
        name:
          type: string
        artist:
          type: string
        thumbnail:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
          description: Ngày video được đăng trên YouTube
        duration:
          type: integer
          description: Thời lượng (giây)

    Song:
      allOf:
        - $ref: "#/components/schemas/SongInput"
        - type: object
          properties:
            _id:
              type: string
            addedAt:
              type: string
              format: date-time
              description: Thời điểm lưu vào hệ thống

    Playlist:
      type: object
      properties:
        _id:
          type: string
          example: 65f123abc123def456789012
        name:
          type: string
          example: Chill buổi tối
        videos:
          type: array
          description: Danh sách videoId
          items:
            type: string
          example: [dQw4w9WgXcQ]
        meta:
          type: object
          description: Tên/kênh/bìa riêng theo videoId (chỉ bài đã sửa)
          additionalProperties:
            $ref: "#/components/schemas/SongMetaInput"
          example:
            dQw4w9WgXcQ: { name: Bài ruột }
        thumbnail:
          type: string
          format: uri
          example: http://localhost:8404/img/nezuko.jpg
        createdAt:
          type: string
          format: date-time
        userId:
          type: string
          nullable: true
        source:
          type: object
          description: Chỉ có khi playlist được nhập từ YouTube
          properties:
            provider:
              type: string
              enum: [youtube]
            playlistId:
              type: string
              example: PLx0sYbCqOb8TBPRdmBHs5Iftvv9TPboYG
            importedAt:
              type: string
              format: date-time
            lastSyncedAt:
              type: string
              format: date-time
            removedIds:
              type: array
              description: videoId người dùng đã xoá khỏi playlist; sync không thêm lại
              items:
                type: string

    SongMetaInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
          description: Tính sau khi trim; rỗng thì dùng tên gốc
        artist:
          type: string
          maxLength: 200
          description: Tên kênh; tính sau khi trim; rỗng thì dùng bản gốc
        thumbnail:
          type: string
          format: uri
          description: "Chỉ nhận `https://i.ytimg.com/vi/<videoId>/(hqdefault|hq1|hq2|hq3).jpg` của chính bài đó"
          example: https://i.ytimg.com/vi/jfKfPfyJRdk/hq2.jpg

    PlaylistSong:
      allOf:
        - $ref: "#/components/schemas/Song"
        - type: object
          properties:
            custom:
              type: boolean
              description: Có mặt (`true`) khi tên/kênh/bìa đã được sửa riêng trong playlist này

    PlaylistWithCover:
      allOf:
        - $ref: "#/components/schemas/Playlist"
        - type: object
          properties:
            cover:
              type: string
              format: uri
              description: Bằng `thumbnail` (cố định)

    SearchHistory:
      type: object
      properties:
        _id:
          type: string
        query:
          type: string
          example: lofi chill
        timestamp:
          type: string
          format: date-time
